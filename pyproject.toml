[project]
name = "dotfiles-checks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.31",
  "pytest>=8.4",
  "pytest-timeout>=2.4",
  "ruff>=0.12",
  "testcontainers>=4.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["e2e: real machine setup in Docker; enable with --e2e"]
timeout = 30

[tool.ruff]
target-version = "py312"
include = ["tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
