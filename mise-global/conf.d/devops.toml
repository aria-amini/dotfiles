[tools]
kubectl = "latest"
helm = "latest"
pulumi = "latest"
railway = "5.62.1"
"npm:varlock" = "1.21.0"

[tools."http:caddy-cf"]
version = "2.11.6"
bin = "caddy-cf"
os = ["linux"]
postinstall = 'set -eu; first_port="$(sysctl -n net.ipv4.ip_unprivileged_port_start)"; if [ "$first_port" -gt 443 ]; then sudo setcap cap_net_bind_service=+ep "$MISE_TOOL_INSTALL_PATH/caddy-cf"; fi'

[tools."http:caddy-cf".platforms.linux-arm64]
url = "https://caddyserver.com/api/download?os=linux&arch=arm64&v=2.11.6&p=github.com%2Fcaddy-dns%2Fcloudflare%40v0.2.4"
checksum = "sha256:4364fded3c7a5abdabc525043c9c35e939cacf5d68417a788b8e9290cb684249"

[tools."http:caddy-cf".platforms.linux-x64]
