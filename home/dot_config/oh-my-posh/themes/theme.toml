#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 2
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
type = 'os'
style = 'plain'
template = '{{.Icon}} '

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'green'
template = '['

[[blocks.segments]]
type = 'session'
style = 'plain'
background = 'transparent'
foreground = 'green'
template = '{{ .UserName }}@{{ .HostName }}'

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'green'
template = '] '

[[blocks.segments]]
type = 'path'
style = 'plain'
background = 'transparent'
foreground = 'blue'
template = '{{ .Path }}'

[blocks.segments.properties]
style = 'full'

[[blocks.segments]]
type = 'git'
style = 'plain'
foreground = 'p:grey'
background = 'transparent'
template = ' {{ .HEAD }}{{ if or .Working.Changed .Staging.Changed }}*{{ end }}{{ if gt .Ahead 0 }} ⇡{{ .Ahead }}{{ end }}{{ if gt .Behind 0 }} ⇣{{ .Behind }}{{ end }}'

[blocks.segments.properties]
fetch_status = true

[[blocks]]
type = 'rprompt'
overflow = 'hidden'

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'yellow'
background = 'transparent'
template = '{{ .FormattedMs }}'

[blocks.segments.properties]
threshold = 5000

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground_templates = [
	"{{if gt .Code 0}}red{{end}}",
	"{{if eq .Code 0}}magenta{{end}}",
]
background = 'transparent'
template = '$'

[transient_prompt]
newline = true
foreground_templates = [
	"{{if gt .Code 0}}red{{end}}",
	"{{if eq .Code 0}}magenta{{end}}",
]
background = 'transparent'
template = '$ '

[secondary_prompt]
foreground = 'magenta'
background = 'transparent'
template = '❯❯ '
