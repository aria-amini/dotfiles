[env]
_.file = [{ path = "~/.env" }]

[settings]
experimental = true
minimum_release_age = "1d"
idiomatic_version_file_enable_tools = ["node"]

[plugins]
nix = "https://github.com/jbadeau/mise-nix.git"
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
python = "3.14"
uv = "latest"
"pipx:basedpyright" = "latest"
"pipx:ruff" = "latest"

rust = "latest"

dotnet = "10"

vite-plus = "latest"
node = "22"
bun = "latest"
"npm:corepack" = "latest"
"npm:pnpm" = "latest"
"npm:typescript" = "latest"

# LSPs
# TODO: only needed for `tsgo --lsp` (TS7 language server). Stable typescript@7
# ships tsc but no LSP binary yet — drop this once TS 7.1 (~Oct 2026) folds the
# language server into the main `typescript` package. Referenced by opencode.json.
"npm:@typescript/native-preview" = "7.0.0-dev.20260707.2"
"npm:@tailwindcss/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"github:LuaLS/lua-language-server" = "3.19.1"
"npm:markdownlint-cli2" = "latest"
"npm:oxfmt" = "latest"
"github:JohnnyMorganz/StyLua" = "latest"
"github:tamasfe/taplo" = "latest"
tflint = "0.64.0"
hadolint = "2.15.1"
"npm:jsonlint" = "1.6.3"
shellcheck = "latest"

# Shell
"github:herdrdev/herdr" = "0.9.1"
"oh-my-posh" = "latest"

# AI
"opencode" = "latest"
"npm:@openai/codex" = "latest"
pi = "latest"
"npm:greptile" = "latest"
claude = "latest"

# nvim
neovim = "0.12.5"
"nix:tree-sitter" = "latest"
"nix:gnumake" = "latest"
"nix:unzip" = "latest"
"nix:xclip" = "latest"
make = "latest"
"nix:gcc" = "16.2.0"

# database 
"nix:postgresql_18" = "latest"
sqlite = "latest"

# images
imagemagick = "latest"
"github:danielgatis/imgcat" = "latest"
"nix:chafa" = "latest"

# VCS
"github:aria-amini/jj" = "v0.46.0-adopt.20260908.1"
"github:aria-amini/jj-ryu" = "0.2.4"
"nix:jjui" = "latest"
"npm:hunkdiff" = "latest"
"difftastic" = "latest"
"github-cli" = "latest"
"nix:gh-dash" = "latest"

# Devops
kubectl = "latest"
helm = "latest"
pulumi = "latest"
railway = "5.62.1"
"npm:varlock" = "1.21.0"

# CLIs 
"bat" = "latest"
jq = "latest"
fd = "latest"
"nix:eza" = "latest"
"just" = "latest"
"fzf" = "latest"
"yazi" = "latest"
"zoxide" = "latest"
"delta" = "latest"
"ripgrep" = "latest"
"nix:erdtree" = "latest"
"pipx:copier" = "latest"
pitchfork = "2.28.0"
fastfetch = "latest"

"npm:chrome-devtools-axi" = "latest"
tmux = "latest"
"github:joshmedeski/sesh" = "latest"
"github:alexpasmantier/television" = "latest"
"github:EzraCerpac/jj-waltz" = "0.7.0"
"gum" = "latest"
"aqua:openbao/openbao/bao" = "latest"
chezmoi = "latest"

[tools."http:caddy-cf"]
version = "2.11.6"
bin = "caddy-cf"
os = ["linux"]
postinstall = 'set -eu; first_port="$(sysctl -n net.ipv4.ip_unprivileged_port_start)"; if [ "$first_port" -gt 443 ]; then sudo setcap cap_net_bind_service=+ep "$MISE_TOOL_INSTALL_PATH/caddy-cf"; fi'

[tools."http:caddy-cf".platforms.linux-arm64]
url = "https://caddyserver.com/api/download?os=linux&arch=arm64&v=2.11.6&p=github.com%2Fcaddy-dns%2Fcloudflare%40v0.2.4"
checksum = "sha256:4364fded3c7a5abdabc525043c9c35e939cacf5d68417a788b8e9290cb684249"

[tools."http:caddy-cf".platforms.linux-x64]
url = "https://caddyserver.com/api/download?os=linux&arch=amd64&v=2.11.6&p=github.com%2Fcaddy-dns%2Fcloudflare%40v0.2.4"
checksum = "sha256:61a9f4bb5666e851f44aafde487c6a6b5ce70a3ee924393d7c28ac556651258f"
