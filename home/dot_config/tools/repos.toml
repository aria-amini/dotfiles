# Forks of upstream projects with aamini/* patch bookmarks.
# Read by the jj scopes in conf.d/tools.toml.

# This fork is temporary until upstream supports Git worktree adoption.
[jj]
upstream = "jj-vcs/jj"
path = "tools/jj"
branch = "main"

[t3code]
upstream = "pingdotgg/t3code"
path = "tools/t3code"
branch = "main"
