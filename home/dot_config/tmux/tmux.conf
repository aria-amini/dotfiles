# ===== Core =====
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ',xterm-256color:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -s escape-time 0
set -g history-limit 1000000
set -g base-index 1
setw -g pane-base-index 1
setw -g renumber-windows on
set -g detach-on-destroy off
set -g focus-events on
set -g display-time 4000
setw -g mode-keys vi
set -g mouse on
set -g set-clipboard on
# opencode wraps its OSC52 copy in a tmux passthrough escape; tmux drops those by default.
set -g allow-passthrough on
set -g status-position top

# ===== Splits & windows =====
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# ===== Panes =====
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind < resize-pane -L 10
bind > resize-pane -R 10
bind + resize-pane -D 10
bind - resize-pane -U 10

# ===== Copy =====
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ===== Popups =====
bind -N "sesh sessions" T display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh
bind -N "last session (sesh)" L run-shell "sesh last"
bind -N "file picker" C-f display-popup -d "#{pane_current_path}" -e FM_PANE="#{pane_id}" -h 60% -w 60% -E "$HOME/.config/tmux/scripts/file-picker"

# ===== Reload =====
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "config reloaded"

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-logging'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# Status composition (v2.3 API; F-flag re-evaluates after tpm loads modules)
set -g status-left-length 100
set -g status-right-length 100
set -gF status-left "#{E:@catppuccin_status_session} "
set -gF status-right "#{E:@catppuccin_status_date_time}"

run '~/.config/tmux/plugins/tpm/tpm'
