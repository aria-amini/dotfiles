# Fork workflow for t3code clones: origin is the aamini fork, upstream is
# the source repo. Track only our bookmarks; everything else stays untracked
# (hidden from the default log, still addressable as name@remote, still
# immutable via builtin_immutable_heads()). Add paths here for other clones.

--when.repositories = ["~/apps/t3code", "~/forks"]

[remotes]
origin.auto-track-bookmarks = "aamini/* | main"
# Upstream main stays untracked: a tracked main@upstream conflicts against
# local main whenever the fork drifts, and conflicted bookmarks break
# revsets that name `main` (jjui's daily()).
upstream.auto-track-bookmarks = "aamini/*"
# Upstream carries ~950 contributor branches; only main ever gets imported.
upstream.fetch-bookmarks = "main"

[revsets]
# Default log: the stock view, minus foreign mutable commits. Synced upstream
# history is immutable and still visible; junk left behind by forgotten
# bookmarks or partial syncs is not.
log = 'builtin_log() & ~(mutable() & ~mine())'

[revset-aliases]
"trunk()" = "main@origin"

# `jj git push --change` lands work in the aamini/ namespace, where the
# auto-track pattern above picks it back up on the next fetch.
[templates]
git_push_bookmark = '"aamini/push-" ++ change_id.short()'
