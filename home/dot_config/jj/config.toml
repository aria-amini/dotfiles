[user]
name = "Aria Amini"
email = "amini5454@gmail.com"

[ui]
pager = ["hunk", "pager"]
diff-formatter = ["difft", "--color=always", "$left", "$right"]
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]

[git]
auto-register-worktrees = true

[merge-tools.hunk]
program = "hunk"
diff-args = ["difftool", "$left", "$right"]
diff-invocation-mode = "file-by-file"

[snapshot]
max-new-file-size = "10MiB"
auto-update-stale = false

[revsets]
log = 'builtin_log()'

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | (working_copies() ~ @)"

[template-aliases]
'format_short_commit_header(commit)' = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  commit.bookmarks(),
  commit.tags(),
  format_deduped_working_copies(commit),
  format_commit_labels(commit),
  if(config("ui.show-cryptographic-signatures").as_boolean(),
    format_short_cryptographic_signature(commit.signature())
  ),
)
'''
# Hide `foo@` when bookmark `foo` is already shown on the same commit.
'format_deduped_working_copies(commit)' = '''
commit.working_copies()
  .filter(|workspace|
    commit.bookmarks().filter(|b| b.name() == workspace.name()).len() == 0
  )
  .map(|workspace|
    if(workspace.target().current_working_copy(),
      label("workspace current", workspace.name() ++ "@"),
      label("workspace other", workspace.name() ++ "@")
    )
  ).join(" ")
'''
