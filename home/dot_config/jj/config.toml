[ui]
pager = ["hunk", "pager"]
diff-formatter = ["difft", "--color=always", "$left", "$right"]
diff-editor = ["nvim", "-c", "DiffEditor $left $right $output"]

[merge-tools.hunk]
program = "hunk"
diff-args = ["difftool", "$left", "$right"]
diff-invocation-mode = "file-by-file"

[user]
name = "Aria Amini"
email = "amini5454@gmail.com"

[snapshot]
max-new-file-size = "10MiB"
auto-update-stale = false

[remotes.origin]
auto-track-bookmarks = "*"

[revset-aliases]
# Everything reachable from another workspace's @ is off-limits to this one;
# prevents parallel agents from rewriting each other's commits.
"immutable_heads()" = "builtin_immutable_heads() | (working_copies() ~ ((::bookmarks(glob:\"aamini/*\") | bookmarks(glob:\"aamini/*\")::) | @))"

# The quiet jjui view shows default-branch tips and only stacks that belong to
# Aria or an active workspace. Everything remains tracked and searchable.
# t3code thread branches are plain git worktree branches (no jj workspace),
# so their bookmark tips are shown directly.
"jjui_refs()" = 'present(trunk()) | present(bookmarks(exact:"main")) | remote_bookmarks(exact:"main") | bookmarks(glob:"t3code/*")'
"jjui_owned_refs()" = 'bookmarks(glob:"aamini/*") | remote_bookmarks(glob:"aamini/*") | bookmarks(glob:"t3code/*") | (working_copies() & (bookmarks(glob:"aamini/*") | bookmarks(glob:"t3code/*"))::)'
"main_delta()" = 'present(main@upstream..main)'
"fork()" = 'jjui_refs() | present(fork_point(main | main@upstream)) | main_delta()'
"daily()" = 'fork() | present(trunk()::@) | (::jjui_owned_refs() ~ ::builtin_immutable_heads())'

# Merged upstream in jj 0.46: `jj workspace add` registers a git worktree.
[git]
auto-register-worktrees = true

# Shared by `jj log` and jjui (jjui shells out to `jj log`).
[template-aliases]
'format_short_commit_header(commit)' = '''
separate(" ",
  format_short_change_id_with_change_offset(commit),
  commit.bookmarks(),
  commit.tags(),
  format_deduped_working_copies(commit),
  format_commit_labels(commit),
  if(config("ui.show-cryptographic-signatures").as_boolean(),
    format_short_cryptographic_signature(commit.signature())
  ),
)
'''
# Hide `foo@` when bookmark `foo` is already shown on the same commit.
'format_deduped_working_copies(commit)' = '''
commit.working_copies()
  .filter(|workspace|
    commit.bookmarks().filter(|b| b.name() == workspace.name()).len() == 0
  )
  .map(|workspace|
    if(workspace.target().current_working_copy(),
      label("workspace current", workspace.name() ++ "@"),
      label("workspace other", workspace.name() ++ "@")
    )
  ).join(" ")
'''

[colors]
bookmark = { fg = "bright yellow", bold = true }
bookmarks = { fg = "bright yellow", bold = true }
local_bookmarks = { fg = "bright yellow", bold = true }
remote_bookmarks = { fg = "bright yellow", bold = true }
# Labels on the working-copy line are wrapped in "working_copy" and only
# match the full combined key, so they need explicit variants.
"working_copy bookmark" = { fg = "bright yellow", bold = true }
"working_copy bookmarks" = { fg = "bright yellow", bold = true }
"working_copy local_bookmarks" = { fg = "bright yellow", bold = true }
"working_copy remote_bookmarks" = { fg = "bright yellow", bold = true }
commit_id = "bright black"
"description placeholder" = { fg = "bright black", italic = true }
"empty description placeholder" = { fg = "bright black", italic = true }
"working_copy description placeholder" = { fg = "bright black", italic = true }
"working_copy empty description placeholder" = { fg = "bright black", italic = true }
"workspace current" = { fg = "bright green", bold = true }
"workspace other" = { fg = "cyan" }
