# pitchfork daemons exec mise-managed tools (varlock, vp) by name. The
# systemd user manager PATH has no mise shims, so daemons die with
# "varlock: not found" (exit 127) until this puts them first.
[Service]
Environment=PATH=%h/.local/share/mise/shims:%h/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
