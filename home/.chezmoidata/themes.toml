# Single source of truth for the terminal theme stack.
# Swap by editing 'theme' and running 'chezmoi apply'.
# ghostty: exact built-in theme name (check with 'ghostty +list-themes').
# ghostty_light/ghostty_dark: optional, makes Ghostty follow OS appearance.
theme = "catppuccin"

[themes.catppuccin]
ghostty = "Catppuccin Mocha"
ghostty_light = "Catppuccin Latte"
ghostty_dark = "Catppuccin Mocha"
nvim = "catppuccin/nvim"
colorscheme = "catppuccin"

[themes.jellybeans]
ghostty = "Jellybeans"
nvim = "nanotech/jellybeans.vim"
colorscheme = "jellybeans"

[themes.srcery]
ghostty = "Srcery"
nvim = "srcery-colors/srcery-vim"
colorscheme = "srcery"
