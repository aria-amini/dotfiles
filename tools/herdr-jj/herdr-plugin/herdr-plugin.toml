id = "aamini.jj"
name = "jj workspaces"
version = "0.6.2"
min_herdr_version = "0.8.2"
description = "jw-backed jj workspaces: create, remove, pick, sidebar status."
platforms = ["linux", "macos"]

[[actions]]
id = "remove"
title = "Remove jj workspace"
contexts = ["workspace"]
command = ["./bin/herdr-jj", "remove", "--current"]

[[actions]]
id = "pick"
title = "Switch jj workspace"
contexts = ["workspace", "global"]
command = ["./bin/herdr-jj", "pick"]

[[actions]]
id = "menu"
title = "Workspace dashboard"
contexts = ["workspace", "global"]
command = ["./bin/herdr-jj", "menu"]

[[panes]]
id = "picker"
title = "jj workspaces"
placement = "popup"
command = ["./bin/herdr-jj", "picker"]

[[panes]]
id = "menu"
title = "jj workspaces"
placement = "popup"
command = ["./bin/herdr-jj", "dashboard"]

[[events]]
on = "workspace.created"
command = ["./bin/herdr-jj", "reporter", "ensure"]

[[events]]
on = "workspace.created"
command = ["./bin/herdr-jj", "nest"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-jj", "reporter", "refresh-once"]
