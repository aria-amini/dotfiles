id = "aamini.jj"
name = "jj workspaces"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Jujutsu workspace support: create, remove, pick, agent spawn, sidebar status."
platforms = ["linux", "macos"]

[[actions]]
id = "remove"
title = "Remove jj workspace"
contexts = ["workspace"]
command = ["./bin/herdr-jj", "remove", "--current"]

[[actions]]
id = "pick"
title = "Switch jj workspace"
contexts = ["workspace", "global"]
command = ["./bin/herdr-jj", "pick"]

[[panes]]
id = "picker"
title = "jj workspaces"
placement = "popup"
command = ["./bin/herdr-jj", "picker"]

[[events]]
on = "worktree.created"
command = ["./bin/herdr-jj", "adopt"]

[[events]]
on = "worktree.removed"
command = ["./bin/herdr-jj", "adopt-forget"]

[[events]]
on = "workspace.created"
command = ["./bin/herdr-jj", "reporter", "ensure"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-jj", "reporter", "refresh-once"]
