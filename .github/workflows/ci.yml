name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Shell checks
        run: |
          shellcheck -x bootstrap.sh setup/*.sh setup/linux/*.sh scripts/*.sh home/dot_local/bin/executable_caddy-start home/dot_local/bin/executable_caddy-health.tmpl
      - name: Install Chezmoi for integration tests
        uses: jdx/mise-action@v5
        with:
          install_args: chezmoi
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Install check dependencies
        run: uv sync --locked
      - name: Python checks
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run basedpyright
      - name: Setup regression tests
        run: uv run pytest -v
