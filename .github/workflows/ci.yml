name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tools
        uses: jdx/mise-action@v5
      - name: Checks
        run: mise run check
      - name: Tests
        run: mise run test
      - name: Real setup smoke test
        run: mise run test:e2e
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-smoke-logs
          path: .pytest_cache/smoke/
          include-hidden-files: true
          if-no-files-found: ignore
